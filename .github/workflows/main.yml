name: Build Anbu Travels APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check ZIP file
        run: |
          ls -la
          test -f AnbuTravels-Complete-Fixed-5.zip

      - name: Extract Android project
        run: |
          set -eu
          unzip -q AnbuTravels-Complete-Fixed-5.zip -d extracted
          find extracted -maxdepth 5 -type f | head -100
          PROJECT_DIR=$(find extracted -type f -name settings.gradle.kts -print -quit | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "Android project or app/build.gradle.kts is missing from ZIP"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: AnbuTravels-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
